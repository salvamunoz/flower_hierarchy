{% extends "base.html" %}

{% block title %}Tasks · Flower{% end %}

{% block navbar %}
  {% module Template("navbar.html", active_tab="tasks") %}
{% end %}


{% block container %}
<input type="hidden" value="{{ time }}" id='time'>

<div class="page-section tasks-page">
  <header class="page-header">
    <div>
      <p class="page-eyebrow">Task history</p>
    </div>
  </header>

  <div class="tasks-toolbar">
    <nav class="task-state-filters" aria-label="Filter tasks by state">
      <button class="task-state-filter active" type="button" data-task-state="" aria-pressed="true">All</button>
      <button class="task-state-filter" type="button" data-task-state="STARTED" aria-pressed="false">Started</button>
      <button class="task-state-filter" type="button" data-task-state="SUCCESS" aria-pressed="false">Succeeded</button>
      <button class="task-state-filter" type="button" data-task-state="FAILURE" aria-pressed="false">Failed</button>
      <button class="task-state-filter" type="button" data-task-state="RETRY" aria-pressed="false">Retried</button>
    </nav>
    <div class="task-view-controls">
      <div class="task-view-options" role="group" aria-label="Task layout">
        <button class="task-toolbar-button active" type="button" data-task-view="tree" aria-pressed="true"
                title="Show the tasks each task started below it">Tree</button>
        <button class="task-toolbar-button" type="button" data-task-view="flat" aria-pressed="false"
                title="List every task on its own">Flat</button>
      </div>
      <button class="task-toolbar-button task-live-toggle" type="button" aria-pressed="false"
              title="Reload the table every few seconds">
        <span class="status-dot" aria-hidden="true"></span> Live
      </button>
    </div>
  </div>

  <section class="tasks-table-card" aria-label="Tasks">
    <p id="task-search-error" class="small text-danger px-3 pt-2 mb-0 d-none" role="alert">
      <span id="task-search-error-message"></span>
      See
      <a href="https://flower.readthedocs.io/en/latest/tasks_filter.html"
         target="_blank" rel="noopener">Search syntax</a> for details.
    </p>
    <table id="tasks-table" class="tasks-table table table-hover align-middle w-100 mb-0">
    <thead>
    <tr>
      {% for name, label in columns %}
      <th data-column="{{ name }}">{{ label }}</th>
      {% end %}
    </tr>
    </thead>
    <tbody></tbody>
    </table>
  </section>
</div>
{% end %}
